name: Release Electron app

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: electron-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.22.0

jobs:
  build:
    name: Build macOS
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set the app version from the tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          node - "$VERSION" <<'NODE'
          const version = process.argv[2];
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
            console.error(`Tag must contain a valid semver version: v${version}`);
            process.exit(1);
          }
          NODE
          pnpm pkg set version="$VERSION"
          echo "Building Foundry $VERSION for macOS"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS installer
        id: build-macos
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm run build

          required=(CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID)
          present=0
          missing=()
          for name in "${required[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              present=$((present + 1))
            else
              missing+=("$name")
            fi
          done

          if (( present == 0 )); then
            echo "signing_mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "No Apple signing secrets found; building an ad-hoc signed app."
            pnpm exec electron-builder --mac --publish never \
              --config.mac.identity=- \
              --config.mac.hardenedRuntime=false \
              --config.mac.notarize=false
          elif (( present == ${#required[@]} )); then
            echo "signing_mode=developer-id" >> "$GITHUB_OUTPUT"
            echo "Building with Developer ID signing and notarization."
            pnpm exec electron-builder --mac --publish never
          else
            echo "::error::Apple signing secrets are partially configured. Missing: ${missing[*]}"
            exit 1
          fi

      - name: Verify macOS signature and notarization
        shell: bash
        env:
          SIGNING_MODE: ${{ steps.build-macos.outputs.signing_mode }}
        run: |
          set -euo pipefail
          APP_PATH="$(find dist -maxdepth 2 -type d -name 'Foundry.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          SIGNATURE_INFO="$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)"

          if [[ "$SIGNING_MODE" == "developer-id" ]]; then
            grep -q "Authority=Developer ID Application" <<< "$SIGNATURE_INFO"
            xcrun stapler validate "$APP_PATH"
            spctl --assess --type execute --verbose=4 "$APP_PATH"
          else
            grep -q "Signature=adhoc" <<< "$SIGNATURE_INFO"
            echo "Ad-hoc signature is valid; users can allow it from Privacy & Security."
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: electron-mac
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*-mac.zip
            dist/*-mac.zip.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: electron-*
          path: artifacts
          merge-multiple: true

      - name: Create the GitHub release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
          find artifacts -type f -print0 |
            xargs -0 -r gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
