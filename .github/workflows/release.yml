name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version v$PACKAGE_VERSION"
            exit 1
          fi

      - name: Lint
        run: pnpm exec eslint src electron.vite.config.ts eslint.config.mjs

      - name: Typecheck
        run: pnpm run typecheck:node && pnpm run typecheck:web

  package:
    name: Package (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            build-command: pnpm exec electron-builder --linux --x64 --publish never
            artifact-name: foundry-linux-x64
            artifact-path: |
              dist/*.AppImage
              dist/*.snap
              dist/*.deb
              dist/*.blockmap
              dist/*-linux.yml
          - name: macOS universal
            os: macos-latest
            build-command: pnpm exec electron-builder --mac --universal --publish never
            artifact-name: foundry-macos-universal
            artifact-path: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/*-mac.yml
          - name: Windows x64
            os: windows-latest
            build-command: pnpm exec electron-builder --win --x64 --publish never
            artifact-name: foundry-windows-x64
            artifact-path: |
              dist/*.exe
              dist/*.blockmap
              dist/*.yml
              !dist/builder-debug.yml
              !dist/builder-effective-config.yaml
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm exec electron-vite build

      - name: Package application
        run: ${{ matrix.build-command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          ARTIFACTS=(release-artifacts/*)
          if (( ${#ARTIFACTS[@]} == 0 )); then
            echo "::error::No release artifacts were downloaded"
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ARTIFACTS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            exit 0
          fi

          RELEASE_FLAGS=(--verify-tag --generate-notes --title "Foundry $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" "${ARTIFACTS[@]}" \
            "${RELEASE_FLAGS[@]}" \
            --repo "$GITHUB_REPOSITORY"
