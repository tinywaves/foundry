name: Publish npm package

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          registry-url: https://registry.npmjs.org

      - name: Prepare the versioned npm package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          node - "$VERSION" <<'NODE'
          const version = process.argv[2];
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
            console.error(`Tag must contain a valid semver version: v${version}`);
            process.exit(1);
          }
          NODE

          PACKAGE_DIR="$RUNNER_TEMP/npm-package"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"

          VERSION="$VERSION" PACKAGE_DIR="$PACKAGE_DIR" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const packageDir = process.env.PACKAGE_DIR;
          const version = process.env.VERSION;
          const manifest = {
            name: '@dhzh/foundry',
            version,
            description: 'Foundry releases and the future Foundry CLI.',
            license: 'Apache-2.0',
            repository: {
              type: 'git',
              url: 'git+https://github.com/tinywaves/foundry.git',
            },
            homepage: 'https://github.com/tinywaves/foundry',
            files: ['dist'],
            publishConfig: { access: 'public' },
          };
          fs.writeFileSync(
            path.join(packageDir, 'package.json'),
            `${JSON.stringify(manifest, null, 2)}\n`,
          );
          fs.writeFileSync(
            path.join(packageDir, 'README.md'),
            `# @dhzh/foundry\n\nFoundry release ${version}.\n`,
          );
          NODE

          # Keep publishing useful before the CLI exists. Once a CLI build emits
          # dist/, it is included automatically without publishing the Electron app.
          if [ -d dist ]; then
            cp -R dist "$PACKAGE_DIR/dist"
          fi

          echo "PACKAGE_DIR=$PACKAGE_DIR" >> "$GITHUB_ENV"
          echo "Publishing @dhzh/foundry@$VERSION"

      - name: Publish to npm via OIDC
        working-directory: ${{ runner.temp }}/npm-package
        run: pnpm publish --provenance --access=public --no-git-checks --ignore-scripts
